
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar movimiento | Mis Finanzas</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="edit-page">
        <section class="panel edit-panel">
            <p class="eyebrow">CONTROL FINANCIERO PERSONAL</p>
            <h1>Editar movimiento</h1>
            <p class="subtitle">
                Modifica los datos y guarda los cambios.
            </p>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for tipo_mensaje, mensaje in mensajes %}
                    <div class="notice {{ tipo_mensaje }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('editar', id=movimiento[0]) }}"
                  class="movement-form">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="descripcion">Descripción</label>
                        <input id="descripcion" name="descripcion"
                               maxlength="120" required
                               value="{{ movimiento[1] }}">
                    </div>

                    <div class="form-field">
                        <label for="tipo">Tipo de movimiento</label>
                        <select id="tipo" name="tipo" required>
                            <option value="Ingreso"
                                {% if movimiento[4] == 'Ingreso' %}selected{% endif %}>
                                Ingreso
                            </option>
                            <option value="Gasto"
                                {% if movimiento[4] == 'Gasto' %}selected{% endif %}>
                                Gasto
                            </option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria" required>
                            {% for categoria in [
                                'Salario', 'Ventas', 'Otros ingresos',
                                'Alimentación', 'Transporte', 'Vivienda',
                                'Servicios', 'Salud', 'Educación',
                                'Entretenimiento', 'Otros gastos'
                            ] %}
                                <option value="{{ categoria }}"
                                    {% if movimiento[2] == categoria %}selected{% endif %}>
                                    {{ categoria }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha"
                               value="{{ movimiento[3] }}" required>
                    </div>

                    <div class="form-field">
                        <label for="importe">Importe ($)</label>
                        <input type="number" id="importe" name="importe"
                               min="0.01" step="0.01"
                               value="{{ movimiento[5] }}" required>
                    </div>
                </div>

                <div class="edit-actions">
                    <button type="submit" class="button button-primary">
                        Guardar cambios
                    </button>
                    <a href="{{ url_for('inicio') }}"
                       class="button button-outline">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
